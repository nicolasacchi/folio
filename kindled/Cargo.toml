[package]
name = "kindled"
version = "0.2.4"
edition = "2021"
description = "Private-cloud sync daemon for jailbroken Kindles"
license = "AGPL-3.0-only"

# Static armv7-unknown-linux-musleabihf binary. HTTPS comes from rustls
# (bundled webpki roots, so the Kindle's ancient CA store is irrelevant);
# rustls' ring backend has C/asm parts, so cross-builds need a C
# cross-toolchain — build-kindle.sh uses the rust-musl-cross docker image.
[dependencies]
minreq = { version = "2", features = ["https-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2" # statvfs for the free-space report

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
