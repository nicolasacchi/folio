[package]
name = "kindled"
version = "0.1.0"
edition = "2021"
description = "Private-cloud sync daemon for jailbroken Kindles"
license = "MIT"

# Every dependency is pure Rust on purpose: the target is a static
# armv7-unknown-linux-musleabihf binary and nothing here needs a C
# cross-toolchain. TLS is intentionally absent — the server lives on the
# LAN and speaks plain HTTP.
[dependencies]
minreq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
