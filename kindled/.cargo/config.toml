# Kindle target: ARMv7 (Cortex-A9 class, hard float) with static musl,
# linked with rust-lld so no C cross-toolchain is required. All
# dependencies are pure Rust, which is what makes this work.
[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]
