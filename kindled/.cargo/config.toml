# Kindle target: ARMv7 (Cortex-A9 class, hard float) with static musl.
# rust-lld links fine even with ring's C/asm objects; compiling those
# objects needs an ARM C toolchain, so build-kindle.sh runs the build in
# the rust-musl-cross docker image (its env linker override wins there).
[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]
