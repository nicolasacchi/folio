# Upstart job so kindled survives reboots (and crashes) on a jailbroken
# Kindle. The rootfs is normally read-only; install with:
#
#   mntroot rw
#   cp /mnt/us/privatecloud/upstart-kindled.conf /etc/upstart/kindled.conf
#   mntroot ro
#   start kindled
#
# `started lab126_gui` fires well after the userstore is mounted, so the
# binary on /mnt/us is reachable. A firmware update wipes /etc/upstart
# additions — reinstall after updating.

description "Folio private-cloud sync daemon"

start on started lab126_gui
stop on stopping lab126_gui

respawn
# Back off instead of spinning if the daemon dies instantly (bad config,
# missing userstore…).
respawn limit 5 300

pre-start script
    [ -x /mnt/us/privatecloud/kindled ] || { stop; exit 0; }
end script

exec /mnt/us/privatecloud/kindled daemon >> /mnt/us/privatecloud/kindled.log 2>&1
