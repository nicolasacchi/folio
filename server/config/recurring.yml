#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Pick up books added to the scan roots (SCAN_ROOTS) overnight.
  nightly_library_scan:
    class: ScanLibraryJob
    schedule: every day at 3:30am

  # Refresh semantic vectors after the scan (covers books added/edited
  # during the day; a full re-embed of the catalog takes a few minutes).
  nightly_embeddings:
    class: CatalogOperationJob
    args: [ "embed_all" ]
    schedule: every day at 4:45am
