# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    queue: default
    schedule: every hour at minute 12

  # Pick up books added to the scan roots (SCAN_ROOTS) overnight.
  nightly_library_scan:
    class: ScanLibraryJob
    schedule: every day at 3:30am

  # Refresh semantic vectors after the scan (covers books added/edited
  # during the day; a full re-embed of the catalog takes a few minutes).
  nightly_embeddings:
    class: CatalogOperationJob
    args: [ "embed_all" ]
    schedule: every day at 4:45am

  # Clears conversions stuck in "running" after their worker crashed, so
  # EnsureKindleFormatJob's active-scope guard doesn't wedge on that book
  # forever (see Conversion::STUCK_AFTER).
  sweep_stuck_conversions:
    class: SweepStuckConversionsJob
    schedule: every 15 minutes

  # Deletes prepared-delivery/cover/thumbnail files that lost their
  # referencing DB row (see Library::StorageGc). After the nightly scan
  # (3:30am) and embeddings refresh (4:45am) so it isn't racing either.
  sweep_orphaned_artifacts:
    class: SweepOrphanedArtifactsJob
    schedule: every day at 5:15am

  # WAL checkpoint + quick_check canary (see DatabaseMaintenance). Last in
  # the overnight lineup (3:30/4:45/5:15) so it checkpoints the WAL churn
  # those jobs themselves generate; once a day is plenty for a single-app
  # SQLite deployment — Solid Queue's own writes are what grow the WAL
  # fastest, and 24h of accumulation is still a small, fast checkpoint.
  nightly_database_maintenance:
    class: DatabaseMaintenanceJob
    schedule: every day at 5:40am
