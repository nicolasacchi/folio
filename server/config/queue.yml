default: &default
  dispatchers:
    - polling_interval: 30
      batch_size: 500
  workers:
    # Host is HDD RAID5: keep one thread and 30s polls to cut SQLite claim
    # chatter. Queue separation still isolates heavy jobs from each other.
    - queues: default
      threads: 1
      processes: 1
      polling_interval: 30
    - queues: conversion
      threads: 1
      processes: 1
      polling_interval: 30
    - queues: scan
      threads: 1
      processes: 1
      polling_interval: 30
    - queues: enrichment
      threads: 1
      processes: 1
      polling_interval: 30
    - queues: indexing
      threads: 1
      processes: 1
      polling_interval: 30

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
