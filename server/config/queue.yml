default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: default
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
    # ebook-convert is CPU/memory heavy; run conversions one at a time.
    - queues: conversion
      threads: 1
      processes: 1
      polling_interval: 0.5
    # Folder scans can run for hours on a large library; keep them off the
    # default/conversion workers so they never block anything.
    - queues: scan
      threads: 1
      processes: 1
      polling_interval: 5
    # External metadata lookups: single-threaded on purpose — the per-job
    # sleep plus one thread keeps us polite (~1 req/s) toward the catalog
    # APIs however many books are queued.
    - queues: enrichment
      threads: 1
      processes: 1
      polling_interval: 5

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
