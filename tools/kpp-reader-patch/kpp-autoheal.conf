# KPP reader-patch dead-man switch — CORRECTED after the 2026-07-13 incident.
#
# What happened the first time: this job was hooked on
# `start on starting lab126_gui`. The patched Reader-utils.jar crashed the
# Java framework before upstart ever reached that stage, so the job never
# ran, WiFi/SSH never came up, and the device was locked out of remote
# recovery entirely. See docs/kindle-519-kpp-reader-routing.html and
# tools/kpp-reader-patch/README.md for the full incident writeup and the
# USB-console recovery path that was needed.
#
# Fix: hook on `start on startup` — the FIRST event upstart emits, before
# any other job (including whatever crashed last time). This is the
# earliest point at which /var/local and /opt are guaranteed mounted.
#
# UNVERIFIED: this was authored during the incident, on the host, without
# device access (the device was locked out). Before trusting it in a live
# apply, confirm on a healthy device that a job hooked on `start on startup`
# actually fires before the framework — e.g. touch a marker file in this
# script's `else` branch and confirm it exists during a normal boot before
# the reader ever starts.
#
# Semantics unchanged: on the boot after the patch is applied (armed +
# unconfirmed), it reverts Reader-utils.jar to the backed-up original.
# Confirm a working patch by deleting the arm file:
#   rm -f /var/local/kpp-patch-armed
start on startup
task
script
    ARM=/var/local/kpp-patch-armed
    SEEN=/var/local/kpp-patch-firstboot
    ORIG=/var/local/kpp-Reader-utils.jar.orig
    JAR=/opt/amazon/ebook/lib/Reader-utils.jar
    [ -f "$ARM" ] || exit 0
    [ -f "$ORIG" ] || exit 0
    if [ -f "$SEEN" ]; then
        mount -o remount,rw / 2>/dev/null || true
        cp "$ORIG" "$JAR.heal" 2>/dev/null && mv "$JAR.heal" "$JAR" 2>/dev/null || true
        sync
        mount -o remount,ro / 2>/dev/null || true
        rm -f "$ARM" "$SEEN"
        logger -t kpp-autoheal "reverted Reader-utils.jar (patch unconfirmed)"
    else
        touch "$SEEN"
    fi
    exit 0
end script
