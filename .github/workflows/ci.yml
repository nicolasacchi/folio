name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      RAILS_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips calibre

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: server
          bundler-cache: true

      - name: "Style: Ruby"
        run: bin/rubocop

      - name: "Security: Gem audit"
        run: bin/bundler-audit

      - name: "Security: Brakeman code analysis"
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

      - name: "Tests: RSpec"
        run: bundle exec rspec

  e2e:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: server
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: server/e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: "Tests: e2e (Playwright)"
        working-directory: server/e2e
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: server/e2e/playwright-report
          retention-days: 7

  kindled:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kindled
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test
